# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "First-year PhD candidate in the HKUST NLP Group at the Hong Kong University of Science and Technology. Research focuses on natural language processing and machine learning."
url: https://entityzonesalvage.github.io
baseurl: "/LJT-Homepage"
repository: "EntityZoneSalvage/LJT-Homepage"

# Site Author (rendered in the sidebar via /_includes/author-profile.html)
author:
  avatar:
  name: "Junteng Liu"
  pronouns:
  bio: "First-year PhD candidate in the HKUST NLP Group at the Hong Kong University of Science and Technology (HKUST)."
  location:
  employer: "HKUST NLP Group, Hong Kong University of Science and Technology"
  uri:
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Publication categories and headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

# Site Settings
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider:
atom_feed:
  hide: false
  path:

# Analytics
analytics:
  provider: "false"
  google:
    tracking_id:

# Reading Files
include:
  - _pages
  - files
exclude:
  - .github
  - Gemfile
  - Dockerfile
  - README
  - node_modules
  - vendor
  - tmp
  - log

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: false
    permalink: /:collection/:path/
  talks:
    output: false
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope: {path: "", type: posts}
    values: {layout: single, author_profile: true, read_time: true, comments: true, share: true, related: true}
  - scope: {path: "", type: pages}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: teaching}
    values: {layout: single, author_profile: true, share: true, comments: true}
  - scope: {path: "", type: publications}
    values: {layout: single, author_profile: true, share: true, comments: true}
  - scope: {path: "", type: portfolio}
    values: {layout: single, author_profile: true, share: true}
  - scope: {path: "", type: talks}
    values: {layout: talk, author_profile: true, share: true}

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
